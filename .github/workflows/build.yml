name: Image build

on:
  release:
    types: [ published ]

jobs:

  # Builds the image and publishes it as blackhost/deployer:1.2.3, :1.2, :1 and :latest (same tags on ghcr.io)
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v1.2.3 -> 1.2.3, 1.2, 1, latest  (release tags must be full semver with a v prefix; v1.2 produces no tags)
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            blackhost/deployer
            ghcr.io/black-host/deployer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # v1.2.3 -> v1.2, v1, latest  (git tags, so deployer@v1 follows the release; pre-releases move nothing, same as the image tags)
      # GitHub rejects the push when the workflows in the release commit differ from the tip of master
      - name: Move the floating git tags
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "$GITHUB_REF_NAME is not a vX.Y.Z release, git tags left as they are"; exit 0; }
          git push --force origin "$GITHUB_SHA:refs/tags/v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "$GITHUB_SHA:refs/tags/v${BASH_REMATCH[1]}" "$GITHUB_SHA:refs/tags/latest"
