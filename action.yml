name: "Deployer 9000"
description: "Deploy code via FTP/FTPS/SFTP (lftp), or SSH (rsync) and run pre/post deploy commands on remote servers"
author: "BlackHOST"
branding:
  icon: "upload-cloud"
  color: "blue"
inputs:
  protocol:
    description: "ftp | sftp | rsync"
    required: false
    default: "ftp"
  server:
    description: "Remote host or IP"
    required: true
  port:
    description: "Remote port. If omitted, defaults to 21 (ftp), 22 (sftp/rsync)"
    required: false
  username:
    description: "Username (FTP/SFTP/SSH)"
    required: true
  password:
    description: "Password (FTP/SFTP/SSH). Prefer keys for SFTP/SSH."
    required: false
  ssh_key:
    description: "PEM-encoded private key for SFTP/SSH"
    required: false
  host_key:
    description: "Public SSH host key of the server (e.g. ssh-ed25519 AAAA...), one per line. When set, any other host key is refused"
    required: false
  local_dir:
    description: "Local directory to upload (relative to GITHUB_WORKSPACE)"
    default: "."
    required: false
  remote_dir:
    description: "Remote directory path"
    default: "/"
    required: false
  secure:
    description: "Use FTPS (TLS). true|false"
    default: "true"
    required: false
  verify_tls:
    description: "Verify TLS cert (FTPS). true|false"
    default: "true"
    required: false
  passive:
    description: "Passive mode (FTP/FTPS)"
    default: "true"
    required: false
  parallel:
    description: "Parallel transfers for lftp mirror (1-5 safe)"
    default: "2"
    required: false
  extra_lftp:
    description: "Extra lftp commands (advanced)"
    required: false
  delete:
    description: "Delete remote files not present locally (sync)"
    default: "false"
    required: false
  only_newer:
    description: "Upload only newer files"
    default: "false"
    required: false
  exclude:
    description: "Comma or line separated exclude globs (e.g. .git,node_modules,*.log)"
    required: false
  include:
    description: "Comma or line separated include globs, deployed even when excluded (e.g. .htaccess,.well-known/)"
    required: false
  safeguards:
    description: "Refuse to deploy when delete is enabled and there is nothing to deploy (it would wipe the target). true|false"
    default: "true"
    required: false
  preserve_times:
    description: "Deploy files with their git commit times. FTP/SFTP then upload only the files that changed. true|false"
    default: "false"
    required: false
  dry_run:
    description: "Plan mode—don’t actually write changes"
    default: "false"
    required: false
  pre_script:
    description: "Command(s) to run on the remote host BEFORE upload"
    required: false
  post_script:
    description: "Command(s) to run on the remote host AFTER upload"
    required: false
  remote_shell:
    description: "Remote shell to use for scripts (e.g., /bin/bash -lc)"
    default: "/bin/bash -lc"
    required: false
outputs: {}
runs:
  using: "docker"
  image: "Dockerfile"
  entrypoint: "/usr/bin/deployer"
